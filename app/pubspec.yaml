name: cablesend_app
description: CableSend - file transfer over cable (Ethernet, Thunderbolt, Android USB, iPhone USB)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  desktop_drop: ^0.9.2
  ffi: ^2.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

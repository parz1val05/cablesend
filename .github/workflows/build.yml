name: build

# Собирает то, что можно поставить и потрогать: APK для Android и папку для Windows.
# Готовые файлы появляются во вкладке Actions -> нужный запуск -> Artifacts.
on:
  push:
  workflow_dispatch:

jobs:
  # Самая быстрая проверка: компилирует Dart и гоняет тесты ядра.
  # Запускается первой, чтобы ошибки было видно через пару минут, а не через двадцать.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Тесты Rust-ядра
        run: cargo test --release

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Создать папки платформ
        working-directory: app
        run: |
          flutter create --platforms=android,windows --project-name cablesend_app --org com.cablesend .
          # flutter create умеет затирать свои шаблонные файлы - возвращаем наши
          git checkout -- lib pubspec.yaml analysis_options.yaml README.md

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Анализ Dart
        working-directory: app
        run: flutter analyze --no-fatal-infos

  android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Цели Rust для Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Создать папку android
        working-directory: app
        run: |
          flutter create --platforms=android --project-name cablesend_app --org com.cablesend .
          git checkout -- lib pubspec.yaml analysis_options.yaml README.md

      - name: Собрать ядро под Android (libcablesend.so)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/android/app/src/main/jniLibs build --release --lib
          ls -R app/android/app/src/main/jniLibs

      - name: Вписать сервис приёма и разрешения
        run: tools/apply_android.sh app

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Собрать APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: cablesend-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Собрать ядро (cablesend.exe)
        run: cargo build --release

      - name: Создать папку windows
        working-directory: app
        run: |
          flutter create --platforms=windows --project-name cablesend_app --org com.cablesend .
          git checkout -- lib pubspec.yaml analysis_options.yaml README.md

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Собрать приложение
        working-directory: app
        run: flutter build windows --release

      - name: Положить ядро рядом с приложением
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item target/release/cablesend.exe $out/
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: cablesend-windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
